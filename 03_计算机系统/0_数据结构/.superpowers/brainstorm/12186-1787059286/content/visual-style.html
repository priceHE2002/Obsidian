<style>
  #apex-408-themes { color: var(--text-primary); }
  #apex-408-themes .theme-subtitle { color: var(--text-secondary); margin: 0 0 1.2rem; }
  #apex-408-themes .theme-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #apex-408-themes .theme-card { padding: 0; text-align: left; appearance: none; color: inherit; }
  #apex-408-themes .theme-screen { min-height: 420px; padding: .8rem; }
  #apex-408-themes .theme-screen.matcha { --t-bg:#e9eee4;--t-surface:#f7f4e9;--t-card:#fcfaf2;--t-text:#27342b;--t-muted:#6d796f;--t-accent:#5e8064;--t-alert:#bf744a;background:linear-gradient(145deg,#e2ebdf,#f4efe1); }
  #apex-408-themes .theme-screen.tundra { --t-bg:#dfe6e2;--t-surface:rgba(242,247,244,.72);--t-card:rgba(255,255,255,.62);--t-text:#203029;--t-muted:#65766d;--t-accent:#688f75;--t-alert:#b36a52;background:radial-gradient(circle at 80% 0,#b7cfbe 0,transparent 36%),linear-gradient(145deg,#d5dfda,#eef1ef); }
  #apex-408-themes .theme-screen.eclipse { --t-bg:#151918;--t-surface:#202624;--t-card:#282f2c;--t-text:#eef2ef;--t-muted:#a2aca6;--t-accent:#9ac7a5;--t-alert:#e29470;background:linear-gradient(145deg,#111513,#242a27); }
  #apex-408-themes .theme-chrome { display:flex;align-items:center;justify-content:space-between;color:var(--t-text);margin-bottom:.7rem; }
  #apex-408-themes .theme-brand { font-weight:600; }
  #apex-408-themes .theme-date { color:var(--t-muted);font-size:.72rem; }
  #apex-408-themes .theme-hero { padding:.9rem;border-radius:14px;background:var(--t-surface);color:var(--t-text);border:1px solid color-mix(in srgb,var(--t-text) 12%,transparent);backdrop-filter:blur(10px); }
  #apex-408-themes .theme-kicker { color:var(--t-accent);font-size:.7rem; }
  #apex-408-themes .theme-title { margin-top:.25rem;font-weight:600; }
  #apex-408-themes .theme-meta { color:var(--t-muted);font-size:.7rem;margin-top:.25rem; }
  #apex-408-themes .theme-actions { display:flex;gap:.4rem;margin-top:.65rem; }
  #apex-408-themes .theme-action { padding:.27rem .55rem;border-radius:999px;background:var(--t-accent);color:var(--t-card);font-size:.68rem; }
  #apex-408-themes .theme-action.ghost { background:color-mix(in srgb,var(--t-accent) 15%,transparent);color:var(--t-accent); }
  #apex-408-themes .theme-panels { display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.55rem; }
  #apex-408-themes .theme-panel { padding:.68rem;border-radius:12px;background:var(--t-card);color:var(--t-text);border:1px solid color-mix(in srgb,var(--t-text) 11%,transparent);backdrop-filter:blur(12px); }
  #apex-408-themes .theme-panel.wide { grid-column:1/-1; }
  #apex-408-themes .theme-label { color:var(--t-muted);font-size:.68rem; }
  #apex-408-themes .theme-value { font-size:1.1rem;font-weight:600;margin-top:.1rem; }
  #apex-408-themes .theme-value.alert { color:var(--t-alert); }
  #apex-408-themes .theme-task { display:flex;align-items:center;gap:.4rem;margin-top:.42rem;font-size:.72rem; }
  #apex-408-themes .theme-check { width:10px;height:10px;border-radius:3px;border:1px solid var(--t-accent); }
  #apex-408-themes .theme-bar { height:6px;border-radius:999px;margin-top:.4rem;background:color-mix(in srgb,var(--t-text) 12%,transparent);overflow:hidden; }
  #apex-408-themes .theme-bar span { display:block;height:100%;width:44%;background:var(--t-accent); }
  #apex-408-themes .theme-copy .tag { display:inline-flex;margin-bottom:.4rem;padding:.12rem .42rem;border-radius:999px;background:var(--selected-bg);color:var(--selected-border);font-size:.7rem; }
  @media(max-width:920px){#apex-408-themes .theme-grid{grid-template-columns:1fr}#apex-408-themes .theme-screen{min-height:0}}
</style>
